<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Bypress | Get in Touch</title>
  <meta name="description" content="Contact Bypress to discuss outsourced office administration, financial operations support, lead generation and operational support.">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
  {% include 'partials/navbar.html' %}

  <main>
    <section id="contact" class="contact-section" style="padding-top: 156px;">
      <div class="section__inner">
        <div class="contact__grid">
          <div class="contact__info">
            <div class="section__tag">
              <span class="section__tag-dot"></span>
              Get In Touch
            </div>
            <h1 class="section__title" style="text-align: left; margin-bottom: 16px;">
              Let's Talk About Your Business
            </h1>
            <p class="why__desc">
              Ready to take the admin off your plate? Reach out and one of our
              team will get back to you promptly.
            </p>

            <div class="contact__details">
              <a href="mailto:info@bypress.ie" class="contact__detail-item">
                <div class="contact__detail-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <div>
                  <div class="contact__detail-label">Email</div>
                  <div class="contact__detail-value">info@bypress.ie</div>
                </div>
              </a>
              <a href="tel:0876273239" class="contact__detail-item">
                <div class="contact__detail-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 3.07 9.81 19.79 19.79 0 0 1 0 1.13 2 2 0 0 1 2 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L6.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </div>
                <div>
                  <div class="contact__detail-label">Phone</div>
                  <div class="contact__detail-value">087 6273239</div>
                </div>
              </a>
              <div class="contact__detail-item">
                <div class="contact__detail-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <div>
                  <div class="contact__detail-label">Location</div>
                  <div class="contact__detail-value">Ireland</div>
                </div>
              </div>
            </div>
          </div>

          <div class="contact__form-wrap">
            <iframe
    src="https://api.clarixa.ai/widget/form/Lsw6XpM0hEzm9r28h6kJ"
    style="width:100%;height:100%;border:none;border-radius:8px"
    id="inline-Lsw6XpM0hEzm9r28h6kJ" 
    data-layout="{'id':'INLINE'}"
    data-trigger-type="alwaysShow"
    data-trigger-value=""
    data-activation-type="alwaysActivated"
    data-activation-value=""
    data-deactivation-type="neverDeactivate"
    data-deactivation-value=""
    data-form-name="Form 32"
    data-height="489"
    data-layout-iframe-id="inline-Lsw6XpM0hEzm9r28h6kJ"
    data-form-id="Lsw6XpM0hEzm9r28h6kJ"
    title="Form 32">
</iframe>
<script src="https://api.clarixa.ai/js/form_embed.js"></script>
          </div>
      </div>
    </section>
  </main>

  {% include 'partials/footer.html' %}

  <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
</body>
</html>
